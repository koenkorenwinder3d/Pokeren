<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches — pokeravond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#123f33;
    --felt-deep:#0b2a22;
    --felt-line:rgba(242,235,220,.14);
    --bone:#f2ebdc;
    --bone-dim:rgba(242,235,220,.58);
    --gold:#e0ac46;
    --crimson:#e0503f;
    --ok:#69b58a;
    --r:14px;
    --pad:clamp(14px,3.5vw,26px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #185043 0%, var(--felt) 45%, var(--felt-deep) 100%);
    background-attachment:fixed;
    color:var(--bone);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.35;
    min-height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:var(--pad) var(--pad) 120px}
  .num{font-family:'Archivo Narrow','Archivo',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  input{font-family:inherit}

  /* ---------- setup ---------- */
  .lead h1{
    font-family:'Archivo Narrow','Archivo',sans-serif;
    font-size:clamp(2.4rem,9vw,4rem);font-weight:700;margin:.1em 0 .05em;line-height:.95;
  }
  .lead p{color:var(--bone-dim);margin:0 0 1.6em;max-width:46ch}
  .field{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .field input[type=text],.field input[type=number]{
    flex:1 1 180px;min-width:0;background:rgba(0,0,0,.22);border:1px solid var(--felt-line);
    color:var(--bone);border-radius:10px;padding:14px 16px;font-size:1.05rem;
  }
  .field input::placeholder{color:rgba(242,235,220,.4)}
  .btn{
    background:var(--bone);color:#14352c;border-radius:10px;padding:14px 20px;
    font-weight:700;font-size:1rem;
  }
  .btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--felt-line);font-weight:600}
  .btn.gold{background:var(--gold);color:#33240b}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .roster{list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:8px}
  .roster li{
    display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;
    background:rgba(0,0,0,.18);border:1px solid var(--felt-line);
  }
  .roster .seat{color:var(--gold);font-weight:700;font-size:.95rem;width:1.4em}
  .roster .nm{flex:1;font-weight:600;font-size:1.1rem}
  .roster button{color:var(--bone-dim);font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:8px}
  .roster button:hover{color:var(--crimson)}
  .setup-note{color:var(--bone-dim);font-size:.92rem;margin:-4px 0 22px}

  /* ---------- pot ---------- */
  .pot{
    text-align:center;padding:18px 0 8px;border-bottom:1px solid var(--felt-line);margin-bottom:20px;
  }
  .pot .cap{color:var(--bone-dim);font-size:.95rem;margin-bottom:-.1em}
  .pot .amt{
    font-family:'Archivo Narrow','Archivo',sans-serif;font-variant-numeric:tabular-nums;
    font-size:clamp(3.4rem,15vw,6rem);font-weight:700;color:var(--gold);line-height:1;
  }
  .pot .sub{color:var(--bone-dim);font-size:.95rem;margin-top:6px}
  .pot .sub b{color:var(--bone);font-weight:600}

  /* ---------- players ---------- */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .p{
    position:relative;border-radius:var(--r);background:rgba(0,0,0,.24);
    border:1px solid var(--felt-line);padding:16px 16px 14px 22px;overflow:hidden;
  }
  .p::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
    background:repeating-linear-gradient(180deg,var(--edge,#7d8c85) 0 14px,transparent 14px 26px);
  }
  .p.folded{opacity:.4}
  .p.allin{border-color:rgba(224,172,70,.5)}
  .p .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .p .nm{font-size:1.3rem;font-weight:600;letter-spacing:.01em}
  .p .stack{font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--bone-dim)}
  .p .stack b{color:var(--bone);font-weight:700;font-size:1.25rem}
  .p .betrow{display:flex;align-items:flex-end;gap:10px;min-height:62px;margin:6px 0 12px}
  .p .bet{
    font-family:'Archivo Narrow','Archivo',sans-serif;font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,9vw,3.4rem);font-weight:700;line-height:1;color:var(--crimson);
  }
  .p .betlab{color:var(--bone-dim);font-size:.95rem;padding-bottom:.45em}
  .p .idle{color:rgba(242,235,220,.3);font-size:1.05rem;padding-bottom:.5em}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;
    letter-spacing:.02em;margin-bottom:.35em;
  }
  .badge.fold{background:rgba(242,235,220,.16);color:var(--bone)}
  .badge.allin{background:var(--gold);color:#33240b}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .acts button{
    background:rgba(242,235,220,.1);border:1px solid var(--felt-line);border-radius:9px;
    padding:13px 4px;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;
    transition:background .12s ease;
  }
  .acts button:hover{background:rgba(242,235,220,.2)}
  .acts button:active{background:var(--bone);color:#14352c}
  .acts .call{background:rgba(105,181,138,.2);border-color:rgba(105,181,138,.45)}
  .acts .fold{background:rgba(224,80,63,.14);border-color:rgba(224,80,63,.4)}
  .acts button:disabled{opacity:.3;cursor:not-allowed}

  /* ---------- bottom bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(8,32,26,.94);backdrop-filter:blur(8px);
    border-top:1px solid var(--felt-line);padding:12px var(--pad);
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  .bar .inner{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .bar .btn{flex:1;padding:15px 10px;font-size:1rem;white-space:nowrap}
  .bar .icon{flex:0 0 auto;padding:15px 16px;font-size:1.15rem}

  /* ---------- modal ---------- */
  .veil{
    position:fixed;inset:0;z-index:40;background:rgba(6,22,18,.82);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;
  }
  .sheet{
    width:100%;max-width:520px;background:#14382f;border:1px solid var(--felt-line);
    border-radius:18px;padding:22px;max-height:92dvh;overflow:auto;
  }
  .sheet h2{font-family:'Archivo Narrow','Archivo',sans-serif;font-size:1.9rem;font-weight:700;margin:0 0 4px}
  .sheet .hint{color:var(--bone-dim);margin:0 0 18px;font-size:.95rem}
  .pick{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .pick button{
    display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
    padding:15px 16px;border-radius:11px;background:rgba(0,0,0,.2);
    border:1px solid var(--felt-line);font-size:1.1rem;font-weight:600;
  }
  .pick button[aria-pressed=true]{background:var(--gold);color:#33240b;border-color:var(--gold)}
  .pick .sm{font-size:.9rem;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums}
  .rowbtns{display:flex;gap:8px}
  .rowbtns .btn{flex:1}
  .manage{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .manage .row{
    display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;
    background:rgba(0,0,0,.2);border:1px solid var(--felt-line);
  }
  .manage .row .nm{flex:1;font-weight:600}
  .manage .row .sm{color:var(--bone-dim);font-size:.88rem;font-variant-numeric:tabular-nums}
  .manage .row button{
    background:rgba(242,235,220,.12);border-radius:9px;padding:9px 12px;font-weight:700;font-size:.92rem;
  }
  table.tally{width:100%;border-collapse:collapse;margin-bottom:16px}
  table.tally th{text-align:left;font-size:.85rem;color:var(--bone-dim);font-weight:600;padding:0 0 8px}
  table.tally td{padding:9px 0;border-top:1px solid var(--felt-line);font-variant-numeric:tabular-nums}
  table.tally td.nm{font-weight:600}
  table.tally td.r{text-align:right}
  .up{color:var(--ok);font-weight:700}
  .down{color:var(--crimson);font-weight:700}
  .settle{list-style:none;margin:0 0 18px;padding:0;font-size:1.02rem}
  .settle li{padding:9px 0;border-top:1px solid var(--felt-line);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<div id="modal"></div>

<script>
(function(){
  "use strict";

  var CHIP = 10;            // cent per fiche
  var DEFAULT_BUYIN = 500;  // cent = € 5,00
  var EDGE = ['#e0503f','#4a90c4','#e0ac46','#69b58a','#b07ad4','#e88fb0','#7d8c85','#d4733a'];

  var S = {
    phase:'setup',
    buyin:DEFAULT_BUYIN,
    players:[],   // {id,name,chips,bet,folded,buyins}
    pot:0,
    seq:1,
    past:[]
  };
  var modal = null;   // {type, picked:[]}

  /* ---------- helpers ---------- */
  function eur(chips){
    var c = chips*CHIP;
    return '€\u00A0' + (c/100).toFixed(2).replace('.',',');
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function live(){ return S.players.filter(function(p){ return !p.folded; }); }
  function highest(){ return S.players.reduce(function(m,p){ return p.folded ? m : Math.max(m,p.bet); },0); }
  function tableBets(){ return S.players.reduce(function(t,p){ return t+p.bet; },0); }
  function total(){ return S.pot + tableBets(); }
  function save(){ S.past.push(JSON.stringify({players:S.players,pot:S.pot})); if(S.past.length>40) S.past.shift(); }
  function undo(){
    if(!S.past.length) return;
    var prev = JSON.parse(S.past.pop());
    S.players = prev.players; S.pot = prev.pot;
    render();
  }

  /* ---------- acties ---------- */
  function addChips(id,n){
    var p = byId(id); if(!p || p.folded || p.chips===0) return;
    save();
    var amt = Math.min(n,p.chips);
    p.chips -= amt; p.bet += amt;
    render();
  }
  function call(id){
    var p = byId(id); if(!p || p.folded) return;
    var need = Math.min(highest()-p.bet, p.chips);
    if(need<=0) return;
    addChips(id,need);
  }
  function allIn(id){
    var p = byId(id); if(!p || p.folded || p.chips===0) return;
    addChips(id,p.chips);
  }
  function fold(id){
    var p = byId(id); if(!p) return;
    save(); p.folded = !p.folded; render();
  }
  function byId(id){
    for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i];
    return null;
  }
  function nextStreet(){
    if(!tableBets()) return;
    save();
    S.pot += tableBets();
    S.players.forEach(function(p){ p.bet = 0; });
    render();
  }
  function payout(ids){
    if(!ids.length) return;
    save();
    var pot = total();
    var each = Math.floor(pot/ids.length);
    var rest = pot - each*ids.length;
    ids.forEach(function(id,i){
      var p = byId(id);
      p.chips += each + (i<rest ? 1 : 0);
    });
    S.pot = 0;
    S.players.forEach(function(p){ p.bet = 0; p.folded = false; });
    modal = null;
    render();
  }

  /* ---------- render ---------- */
  function render(){
    document.getElementById('app').innerHTML = S.phase==='setup' ? setupView() : tableView();
    document.getElementById('bar').innerHTML  = S.phase==='setup' ? '' : barView();
    document.getElementById('modal').innerHTML = modal ? modalView() : '';
    var f = document.getElementById('focus');
    if(f) f.focus();
  }

  function setupView(){
    var rows = S.players.map(function(p,i){
      return '<li><span class="seat num">'+(i+1)+'</span><span class="nm">'+esc(p.name)+'</span>'+
             '<button data-act="drop" data-id="'+p.id+'" aria-label="'+esc(p.name)+' verwijderen">&times;</button></li>';
    }).join('');
    return ''+
    '<div class="lead">'+
      '<h1>Fiches op tafel</h1>'+
      '<p>Iedereen koopt in voor '+eur(S.buyin/CHIP)+'. Eén fiche is 10 cent, dus je begint met '+(S.buyin/CHIP)+' fiches. '+
      'Zet in met de knoppen, de tafel ziet in één oogopslag wie wat heeft liggen.</p>'+
    '</div>'+
    '<div class="field">'+
      '<input type="text" id="focus" data-input="name" placeholder="Naam van speler" autocomplete="off" enterkeyhint="done">'+
      '<button class="btn" data-act="add">Speler toevoegen</button>'+
    '</div>'+
    (rows ? '<ul class="roster">'+rows+'</ul>' : '<p class="setup-note">Nog geen spelers. Voeg er minstens twee toe.</p>')+
    '<button class="btn gold" data-act="start" '+(S.players.length<2?'disabled':'')+'>Deel de fiches uit</button>';
  }

  function tableView(){
    var hi = highest();
    var head = ''+
      '<div class="pot">'+
        '<div class="cap">In de pot</div>'+
        '<div class="amt">'+eur(total())+'</div>'+
        '<div class="sub">'+total()+' fiches'+
          (hi ? ' &nbsp;·&nbsp; te callen: <b>'+eur(hi)+'</b>' : '')+
        '</div>'+
      '</div>';

    var cards = S.players.map(function(p,i){
      var need = Math.min(hi-p.bet, p.chips);
      var cls = 'p'+(p.folded?' folded':'')+((p.chips===0&&!p.folded)?' allin':'');
      var badge = p.folded ? '<span class="badge fold">gepast</span>'
                : (p.chips===0 ? '<span class="badge allin">all-in</span>' : '');
      var betblock = p.bet
        ? '<span class="bet num">'+eur(p.bet)+'</span><span class="betlab">ingezet</span>'
        : '<span class="idle">geen inzet</span>';
      return ''+
      '<div class="'+cls+'" style="--edge:'+EDGE[i%EDGE.length]+'">'+
        '<div class="top">'+
          '<span class="nm">'+esc(p.name)+'</span>'+
          '<span class="stack num">stack <b>'+eur(p.chips)+'</b></span>'+
        '</div>'+
        '<div class="betrow">'+badge+betblock+'</div>'+
        '<div class="acts">'+
          btn(p,'chip','1','+ 0,10')+
          btn(p,'chip','5','+ 0,50')+
          btn(p,'chip','10','+ 1,00')+
          '<button class="call" data-act="call" data-id="'+p.id+'" '+(need<=0||p.folded?'disabled':'')+'>'+
            (need>0 ? 'call '+eur(need) : 'check')+'</button>'+
          '<button data-act="allin" data-id="'+p.id+'" '+(p.chips===0||p.folded?'disabled':'')+'>all-in</button>'+
          '<button class="fold" data-act="fold" data-id="'+p.id+'">'+(p.folded?'terug':'pas')+'</button>'+
        '</div>'+
      '</div>';
    }).join('');

    return head + '<div class="grid">'+cards+'</div>';
  }
  function btn(p,act,n,label){
    var off = p.folded || p.chips===0;
    return '<button data-act="'+act+'" data-n="'+n+'" data-id="'+p.id+'" '+(off?'disabled':'')+'>'+label+'</button>';
  }

  function barView(){
    return '<div class="bar"><div class="inner">'+
      '<button class="btn ghost icon" data-act="undo" '+(S.past.length?'':'disabled')+' aria-label="Laatste actie ongedaan maken">&#8630;</button>'+
      '<button class="btn ghost" data-act="street" '+(tableBets()?'':'disabled')+'>Volgende ronde</button>'+
      '<button class="btn gold" data-act="winner" '+(total()?'':'disabled')+'>Pot uitbetalen</button>'+
      '<button class="btn ghost icon" data-act="menu" aria-label="Spelers en eindstand">&#8942;</button>'+
    '</div></div>';
  }

  function modalView(){
    if(modal.type==='winner') return winnerSheet();
    if(modal.type==='menu')   return menuSheet();
    if(modal.type==='tally')  return tallySheet();
    return '';
  }

  function winnerSheet(){
    var rows = S.players.map(function(p){
      var on = modal.picked.indexOf(p.id)>-1;
      return '<button data-act="pick" data-id="'+p.id+'" aria-pressed="'+on+'">'+
               '<span>'+esc(p.name)+'</span><span class="sm">'+eur(p.chips)+(p.folded?' · gepast':'')+'</span>'+
             '</button>';
    }).join('');
    var n = modal.picked.length;
    return '<div class="veil" data-act="close"><div class="sheet" data-stop>'+
      '<h2>Wie wint '+eur(total())+'?</h2>'+
      '<p class="hint">Kies meerdere spelers om de pot te delen.</p>'+
      '<div class="pick">'+rows+'</div>'+
      '<div class="rowbtns">'+
        '<button class="btn ghost" data-act="close">Terug</button>'+
        '<button class="btn gold" data-act="pay" '+(n?'':'disabled')+'>'+
          (n>1 ? 'Verdeel over '+n+' spelers' : 'Betaal de pot uit')+'</button>'+
      '</div>'+
    '</div></div>';
  }

  function menuSheet(){
    var rows = S.players.map(function(p){
      return '<div class="row">'+
        '<span class="nm">'+esc(p.name)+'</span>'+
        '<span class="sm">'+p.buyins+'&times; ingekocht</span>'+
        '<button data-act="rebuy" data-id="'+p.id+'">+ '+eur(S.buyin/CHIP)+'</button>'+
      '</div>';
    }).join('');
    return '<div class="veil" data-act="close"><div class="sheet" data-stop>'+
      '<h2>Spelers</h2>'+
      '<p class="hint">Iemand blut? Koop opnieuw in. De inkoop telt mee in de eindafrekening.</p>'+
      '<div class="manage">'+rows+'</div>'+
      '<div class="field">'+
        '<input type="text" data-input="late" placeholder="Late speler toevoegen" autocomplete="off">'+
        '<button class="btn" data-act="late">Erbij</button>'+
      '</div>'+
      '<div class="rowbtns">'+
        '<button class="btn ghost" data-act="close">Terug</button>'+
        '<button class="btn" data-act="tally">Eindafrekening</button>'+
      '</div>'+
    '</div></div>';
  }

  function tallySheet(){
    var open = total()>0;
    var rows = S.players.map(function(p){
      var net = p.chips*CHIP - p.buyins*S.buyin;
      var cls = net>0?'up':(net<0?'down':'');
      var sign = net>0?'+':'';
      return '<tr><td class="nm">'+esc(p.name)+'</td>'+
        '<td class="r">'+eur(p.chips)+'</td>'+
        '<td class="r '+cls+'">'+sign+(net/100).toFixed(2).replace('.',',')+'</td></tr>';
    }).join('');
    var moves = settle().map(function(m){
      return '<li>'+esc(m.from)+' betaalt '+esc(m.to)+' <b>€\u00A0'+(m.amt/100).toFixed(2).replace('.',',')+'</b></li>';
    }).join('');
    return '<div class="veil" data-act="close"><div class="sheet" data-stop>'+
      '<h2>Eindafrekening</h2>'+
      (open
        ? '<p class="hint">Er ligt nog '+eur(total())+' in de pot. Betaal de hand eerst uit, anders klopt de telling niet.</p>'
        : '<p class="hint">Stack min inkoop, en wie wie betaalt.</p>')+
      '<table class="tally"><tr><th>Speler</th><th style="text-align:right">Stack</th><th style="text-align:right">Saldo</th></tr>'+rows+'</table>'+
      (moves ? '<ul class="settle">'+moves+'</ul>' : '<p class="hint">Iedereen speelt quitte.</p>')+
      '<div class="rowbtns"><button class="btn ghost" data-act="close">Terug naar tafel</button></div>'+
    '</div></div>';
  }

  function settle(){
    var debt = S.players.map(function(p){
      return {name:p.name, v:p.chips*CHIP - p.buyins*S.buyin};
    });
    var owe = debt.filter(function(d){return d.v<-0.5;}).map(function(d){return {name:d.name,v:-d.v};});
    var get = debt.filter(function(d){return d.v>0.5;}).map(function(d){return {name:d.name,v:d.v};});
    owe.sort(function(a,b){return b.v-a.v;}); get.sort(function(a,b){return b.v-a.v;});
    var out=[], i=0, j=0;
    while(i<owe.length && j<get.length){
      var amt = Math.min(owe[i].v, get[j].v);
      if(amt>0) out.push({from:owe[i].name, to:get[j].name, amt:amt});
      owe[i].v -= amt; get[j].v -= amt;
      if(owe[i].v<=0.5) i++;
      if(get[j].v<=0.5) j++;
    }
    return out;
  }

  /* ---------- events ---------- */
  function addPlayer(name){
    name = (name||'').trim();
    if(!name) return false;
    S.players.push({id:S.seq++, name:name.slice(0,18), chips:S.buyin/CHIP, bet:0, folded:false, buyins:1});
    return true;
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    if(t.hasAttribute('data-stop')) return;
    var act = t.getAttribute('data-act');
    var id  = parseInt(t.getAttribute('data-id'),10);

    if(act==='close' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act=close]')) return;

    switch(act){
      case 'add': {
        var f = document.querySelector('[data-input=name]');
        if(addPlayer(f.value)) render();
        break;
      }
      case 'drop':
        S.players = S.players.filter(function(p){ return p.id!==id; });
        render(); break;
      case 'start':
        S.phase='game'; S.past=[]; render(); break;
      case 'chip': addChips(id, parseInt(t.getAttribute('data-n'),10)); break;
      case 'call': call(id); break;
      case 'allin': allIn(id); break;
      case 'fold': fold(id); break;
      case 'street': nextStreet(); break;
      case 'undo': undo(); break;
      case 'winner': modal={type:'winner',picked:[]}; render(); break;
      case 'menu': modal={type:'menu'}; render(); break;
      case 'tally': modal={type:'tally'}; render(); break;
      case 'close': modal=null; render(); break;
      case 'pick': {
        var k = modal.picked.indexOf(id);
        if(k>-1) modal.picked.splice(k,1); else modal.picked.push(id);
        render(); break;
      }
      case 'pay': payout(modal.picked); break;
      case 'rebuy': {
        var p = byId(id); if(!p) break;
        save();
        p.chips += S.buyin/CHIP; p.buyins++;
        render(); break;
      }
      case 'late': {
        var g = document.querySelector('[data-input=late]');
        if(addPlayer(g.value)){ modal=null; render(); }
        break;
      }
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var el = e.target;
      if(el.getAttribute && el.getAttribute('data-input')==='name'){
        if(addPlayer(el.value)) render();
      }
      if(el.getAttribute && el.getAttribute('data-input')==='late'){
        if(addPlayer(el.value)){ modal=null; render(); }
      }
    }
    if(e.key==='Escape' && modal){ modal=null; render(); }
  });

  window.addEventListener('beforeunload', function(e){
    if(S.phase==='game'){ e.preventDefault(); e.returnValue=''; }
  });

  render();
})();
</script>
</body>
</html>
